<head>

<title>Gasilski informacijski sistem</title>

<style>
:root{--pri:#b3161b;--sec:#e9a020;--sb:#2b1214;--bg:#eef2f6;--sf:#fff;--sf2:#f6f8fb;--tx:#13202e;--mu:#586a7c;--bd:#d9e1ea;--lk:#b3161b;--ok:#166534;--okb:#dcf5e4;--wr:#8a4b06;--wrb:#fdf0d2;--er:#9b1c1c;--erb:#fde2e2;--in:#1e3f9a;--inb:#dde8fb;--gr:#334155;--grb:#e6ebf1;--r:6px}
[data-theme=dark]{--bg:#0c121a;--sf:#141c26;--sf2:#19232f;--tx:#e6edf5;--mu:#93a4b6;--bd:#283544;--lk:#ff9c94;--ok:#86efac;--okb:#12341f;--wr:#fcd34d;--wrb:#3a2a0b;--er:#fca5a5;--erb:#411616;--in:#a5c3ff;--inb:#14284f;--gr:#cbd5e1;--grb:#243140}
*{box-sizing:border-box}html{font-size:15px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--lk);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:1.45rem}h2{font-size:1.1rem}h3{font-size:.98rem}
.skip{position:absolute;left:-999px;top:0;background:var(--pri);color:#fff;padding:8px 12px;z-index:200}.skip:focus{left:8px;top:8px}
[hidden]{display:none!important}
#boot{display:grid;place-items:center;height:100vh;color:var(--mu)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);grid-template-areas:"side top" "side main";height:100vh;height:100dvh}
.side{grid-area:side;background:var(--sb);color:#d7e3ef;overflow:auto;padding:0 8px 24px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:14px 8px;margin:0 -8px 6px;color:#fff;font-weight:700;background:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.05) 0 1px,transparent 1px 14px)}
.brand img{height:34px;max-width:110px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
.brand small{display:block;font-weight:400;color:#9fb6cc;font-size:.72rem}
.ng{margin:14px 0 3px;padding:0 10px;font-size:.78rem;color:#8fa9c2}
.side a.ni{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r);color:#d7e3ef;font-size:.92rem;border-left:3px solid transparent}
.side a.ni:hover{background:rgba(255,255,255,.08);text-decoration:none}
.side a.ni.on{background:rgba(255,255,255,.14);border-left-color:var(--sec);color:#fff;font-weight:600}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--sf);border-bottom:1px solid var(--bd);z-index:30}
.hb{display:none}
.sp{flex:1}
.gs{position:relative;flex:1;max-width:420px}
.gs input{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf2)}
.gsr{position:absolute;top:110%;left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:60}
.gsr h4{margin:0;padding:6px 10px;font-size:.78rem;background:var(--sf2);color:var(--mu)}
.gsr a{display:block;padding:6px 10px;color:var(--tx)}.gsr a:hover{background:var(--sf2);text-decoration:none}
.main{grid-area:main;overflow:auto;padding:18px 22px 96px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);cursor:pointer;color:var(--tx);white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--sf2);text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:var(--er);border-color:var(--er)}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--sf2)}
.btn.sm{padding:4px 8px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.cnt{background:var(--er);color:#fff;border-radius:9px;font-size:.7rem;padding:0 5px;margin-left:2px}
.dd{position:relative;display:inline-block}.dd>summary{list-style:none;cursor:pointer}.dd>summary::-webkit-details-marker{display:none}
.ddm{position:absolute;right:0;top:110%;min-width:200px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:50;padding:4px;max-height:60vh;overflow:auto}
.ddm a,.ddm button,.ddm label{display:flex;gap:8px;width:100%;padding:6px 10px;border:0;background:none;text-align:left;cursor:pointer;color:var(--tx);border-radius:4px;font-size:.92rem}
.ddm a:hover,.ddm button:hover,.ddm label:hover{background:var(--sf2);text-decoration:none}
.pgh{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.bc{font-size:.82rem;color:var(--mu);margin-bottom:4px}.bc a{color:var(--mu)}
.pa{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card>h2,.card>.chd{margin-bottom:10px}
.chd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tb input[type=search],.tb input[type=text],.tb select{padding:6px 9px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:3px 11px;font-size:.85rem}.chip b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
table.tbl{width:100%;border-collapse:collapse;font-size:.91rem}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tbl th{background:var(--sf2);font-weight:600;white-space:nowrap;position:sticky;top:0}
.tbl th button{all:unset;cursor:pointer;font-weight:600}
.tbl tbody tr.rw{cursor:pointer}.tbl tbody tr:hover{background:var(--sf2)}
.tbl td.r,.tbl th.r{text-align:right}.tbl tfoot td{font-weight:700;background:var(--sf2)}
.tbl.sm td,.tbl.sm th{padding:4px 6px}
.tbl input,.tbl select{width:100%;padding:4px 6px;border:1px solid var(--bd);border-radius:4px;background:var(--sf)}
.bd{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;white-space:nowrap}
.bd.ok{background:var(--okb);color:var(--ok)}.bd.er{background:var(--erb);color:var(--er)}.bd.wr{background:var(--wrb);color:var(--wr)}.bd.in{background:var(--inb);color:var(--in)}.bd.gr{background:var(--grb);color:var(--gr)}
.tg{display:inline-block;background:var(--grb);color:var(--gr);border-radius:4px;padding:0 6px;margin:0 3px 2px 0;font-size:.8rem}
.mu{color:var(--mu)}.pre{white-space:pre-wrap}.er{color:var(--er)}.ok{color:var(--ok)}.r{text-align:right}.nw{white-space:nowrap}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{display:block;background:var(--sf2);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:var(--r);padding:10px 12px;color:var(--tx)}
.kpi:hover{text-decoration:none;border-color:var(--pri)}.kpi.wr{border-left-color:var(--sec)}.kpi.er{border-left-color:#c2372f}.kpi.ok{border-left-color:#2c8a4b}
.kl{font-size:.8rem;color:var(--mu)}.kv{font-size:1.45rem;font-weight:700;line-height:1.25}.ks{font-size:.78rem;color:var(--mu)}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.cg .cb{position:relative;height:250px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}.fld.full{grid-column:1/-1}
.fld label{font-size:.85rem;color:var(--mu)}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.inp{padding:7px 9px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);width:100%}
.fld input[type=checkbox]{width:20px;height:20px}
.fe{color:var(--er);font-size:.8rem;min-height:0}.fh{font-size:.78rem;color:var(--mu)}.rq{color:var(--er)}
.mo{position:fixed;inset:0;background:rgba(8,16,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:100;overflow:auto}
.md{background:var(--sf);border-radius:8px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}.md.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.mh .x{all:unset;cursor:pointer;font-size:1.6rem;line-height:1;padding:0 6px}
.mb{padding:16px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);flex-wrap:wrap}
#toasts{position:fixed;right:12px;bottom:70px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--sb);color:#fff;padding:10px 14px;border-radius:var(--r);box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:340px;border-left:4px solid #3ea76a}
.toast.err{border-left-color:#e5534b}.toast.warn{border-left-color:var(--sec)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 14px;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}.tab:hover{text-decoration:none;color:var(--tx)}.tab.on{color:var(--tx);border-bottom-color:var(--sec);font-weight:600}
.kvt{width:100%;border-collapse:collapse}.kvt td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}.kvt td:first-child{width:34%;color:var(--mu)}
.dz{border:2px dashed var(--bd);border-radius:var(--r);padding:12px;text-align:center;color:var(--mu);cursor:pointer;background:var(--sf2)}.dz.over{border-color:var(--pri);background:var(--inb)}
.dzl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dzl span{background:var(--grb);border-radius:4px;padding:2px 8px;font-size:.85rem}.dzl button{all:unset;cursor:pointer;margin-left:6px;color:var(--er)}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.kc{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:8px;min-height:120px}.kc h3{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.9rem}
.kcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:8px;margin-bottom:8px;cursor:grab;font-size:.9rem}.kcard small{color:var(--mu)}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--mu)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--inb);color:var(--in);padding:8px 10px;border-radius:var(--r);margin-bottom:8px}
.empty{text-align:center;padding:34px 12px;color:var(--mu)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--bd)}.tl li{margin:0 0 12px;position:relative;padding-left:12px}.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sec)}
.cmt{border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;background:var(--sf2)}.mn{color:var(--lk)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd)}
.cal>div{background:var(--sf);min-height:92px;padding:3px 4px;font-size:.8rem;overflow:hidden}.cal>.h{min-height:0;text-align:center;font-weight:600;background:var(--sf2)}.cal>.o{opacity:.45}.cal>.t{outline:2px solid var(--sec);outline-offset:-2px}
.ce{display:block;margin:2px 0;padding:1px 5px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.76rem}.ce:hover{text-decoration:none;filter:brightness(1.1)}
.bn{display:none}
.login{max-width:520px;margin:5vh auto;padding:0 12px}.login .card{padding:20px}
.login h1{margin-bottom:6px}.brandhero{background:var(--sb);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;background-image:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.06) 0 1px,transparent 1px 16px)}
.crd{width:85.6mm;height:54mm;border-radius:10px;border:1px solid #9aa;background:linear-gradient(135deg,#fff 0,#e8f1fb 100%);color:#2b1214;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;font-size:11px}
.crd img.lg{height:26px;max-width:100px;object-fit:contain}.crd .qr{position:absolute;right:10px;bottom:10px;width:64px;height:64px}.crd .nm{font-size:16px;font-weight:700}
.pub{max-width:960px;margin:0 auto;padding:16px}.pub header{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:3px solid var(--sec);margin-bottom:16px}.pub header img{height:56px}
.pub nav{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tag-in{width:100%}
@media(max-width:860px){
.shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
.side{position:fixed;inset:0 25% 0 0;max-width:290px;transform:translateX(-102%);transition:transform .18s;box-shadow:6px 0 24px rgba(0,0,0,.35)}.side.open{transform:none}
.hb{display:inline-flex}.main{padding:12px 10px 90px}.fg{grid-template-columns:minmax(0,1fr)}
.top .hide-m,.sp{display:none}.gs{max-width:none}
.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);z-index:35;padding-bottom:env(safe-area-inset-bottom,0)}
.bn a,.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:.7rem;color:var(--mu);border:0;background:none;text-decoration:none}.bn .on{color:var(--pri);font-weight:600}
#toasts{bottom:78px}.pgh{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top,.bn,#toasts,.pa,.tb,.pg,.bulk{display:none!important}.shell{display:block;height:auto}.main{overflow:visible;padding:0}}
</style>

<script>
'use strict';
/* Gasilski informacijski sistem v1.0 – enodatotečna aplikacija (vanilla JS). Podatki: JSON v izbrani shrambi. */
const VER='1.0';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowISO=()=>new Date().toISOString();
const S={lang:localStorage.pgdLang||'sl',theme:localStorage.pgdTheme||'light',db:{},st:{},user:null,lv:{},year:new Date().getFullYear(),saving:'idle',dirty:new Set(),charts:[],rev:0,q:{},seg:[],after:[]};
const MAXF=20*1024*1024;
const EN={'Domov':'Home','Nadzorna plošča':'Dashboard','Koledar':'Calendar','Obvestila':'Notifications','Iskanje':'Search','Članstvo':'Membership','Člani':'Members','Kategorije':'Categories','Članarine':'Membership fees','Finance':'Finance','Blagajna':'Cash desk','Bančni računi':'Bank accounts','Bančne transakcije':'Bank transactions','Računi':'Invoices','Plačila':'Payments','Knjiga prihodkov in odhodkov':'Ledger','Povračila stroškov':'Expense claims','Potni nalogi':'Travel orders','Donatorji in sponzorji':'Donors & sponsors','Projekti':'Projects','Naloge':'Tasks','Razpisi':'Grants','Pogodbe':'Contracts','Proračuni projektov':'Project budgets','Dogodki':'Events','Prijave na dogodke':'Registrations','Sestanki':'Meetings','Organi društva':'Bodies','Volitve in mandati':'Elections','Partnerji':'Partners','Kontakti':'Contacts','Operativni gasilci in ure':'Volunteers','Prostovoljci':'Volunteers','Gasilske ure':'Volunteer hours','Dokumenti':'Documents','Publikacije':'Publications','Knjižnica':'Library','Postaje':'Stations','Senzorji':'Sensors','Meritve':'Measurements','Terensko delo':'Fieldwork','Oprema':'Equipment','Izposoja opreme':'Equipment loans','Sporočila':'Messages','Predloge e-pošte':'Email templates','Poročila':'Reports','Statistika':'Statistics','Letno poročilo':'Annual report','Administracija':'Administration','Nastavitve':'Settings','Pomoč':'Help','Shrani':'Save','Prekliči':'Cancel','Zapri':'Close','Uredi':'Edit','Briši':'Delete','Novo':'New','Izvoz':'Export','Uvoz':'Import','Podatki':'Details','Povezano':'Related','Komentarji':'Comments','Aktivnost':'Activity','Odjava':'Log out','Prijava':'Log in','Uporabniško ime':'Username','Geslo':'Password','Ni zapisov.':'No records.','Arhiv':'Archive','Aktivni':'Active','Vsi':'All','Mojih naloge':'My tasks','Moj portal':'My portal','Moje naloge':'My tasks','Naslednji korak':'Next step','Arhiviraj':'Archive','Obnovi':'Restore','Natisni / PDF':'Print / PDF','Napredni filtri':'Advanced filters','Stolpci':'Columns','Zgodovina':'History','Sistem':'System','Analitika':'Analytics','Vsebina':'Content','Ljudje in partnerji':'People & partners','Meteorologija':'Meteorology','Komunikacija':'Communication','Uvoz podatkov':'Import data','Napredek':'Progress'};
const t=s=>(S.lang==='en'&&EN[s])||s;
const fmtD=d=>{if(!d)return'';const p=String(d).slice(0,10).split('-');return p.length<3?String(d):`${+p[2]}. ${+p[1]}. ${p[0]}`};
const fmtDT=d=>d?fmtD(d)+' '+String(d).slice(11,16):'';
const loc=()=>S.lang==='en'?'en-GB':'sl-SI';

function validate(sc,v){const e={};for(const f of sc.f){if(f.hid||f.ro)continue;const x=v[f.k];const empty=x===''||x==null||(Array.isArray(x)&&!x.length);
if(f.req&&empty&&f.t!=='bool'){e[f.k]='Polje je obvezno.';continue}if(empty)continue;
if(f.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x))e[f.k]='Neveljaven e-naslov.';
if(f.t==='tel'&&!/^[+\d][\d\s/().-]{5,}$/.test(x))e[f.k]='Neveljavna telefonska številka.';
if(f.t==='iban'&&!IBANok(x))e[f.k]='Neveljaven IBAN.';
if(f.t==='date'&&isNaN(new Date(x)))e[f.k]='Neveljaven datum.';
if(f.t==='money'&&num(x)<0&&!(SC.bank_tx===sc))e[f.k]='Znesek ne sme biti negativen.';
if(f.t==='url'&&!/^https?:\/\//i.test(x))e[f.k]='Vnesite polni URL (https://…).'}
if(sc.name==='events'&&v.end_date&&v.date&&v.end_date<v.date)e.end_date='Konec je pred začetkom.';
if(sc.name==='travel_orders'&&v.dep&&v.arr&&v.arr<v.dep)e.arr='Prihod je pred odhodom.';
return e}

let IMP=null;
const impDate=v=>{if(v instanceof Date)return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;return null};
function impConv(sc,row,map){const rec={},errs=[],warns=[];for(const f of sc.f){if(f.hid&&!f.calc||f.calc||f.t==='password')continue;const col=map[f.k];if(!col)continue;let raw=row[col];if(raw==null||raw==='')continue;
switch(f.t){case'date':{const d=impDate(raw);if(d)rec[f.k]=d;else errs.push(f.l+': neveljaven datum «'+raw+'»');break}
case'datetime':{const d=impDate(raw);if(d)rec[f.k]=d+(String(raw).match(/(\d{1,2}):(\d{2})/)?'T'+pad(String(raw).match(/(\d{1,2}):(\d{2})/)[1])+':'+String(raw).match(/(\d{1,2}):(\d{2})/)[2]:'T00:00');else errs.push(f.l+': neveljaven čas');break}
case'num':case'money':case'pct':{const n=num(raw);if(isNaN(n)||(typeof raw==='string'&&!/^[\s\d.,+-]+(EUR|€)?\s*$/i.test(raw)))errs.push(f.l+': ni število «'+raw+'»');else rec[f.k]=n;break}
case'bool':rec[f.k]=/^(da|true|1|yes|x|✓)$/i.test(String(raw).trim());break;
case'sel':{const o=optsOf(f).find(x=>ascii(x).toLowerCase()===ascii(String(raw)).toLowerCase());if(o)rec[f.k]=o;else warns.push(f.l+': neznana vrednost «'+raw+'»');break}
case'ref':{const q=ascii(String(raw)).toLowerCase().trim();const r=live(f.coll).find(r=>ascii(labelOf(f.coll,r)).toLowerCase()===q||ascii(r.number||'').toLowerCase()===q||ascii(r.email||'').toLowerCase()===q||ascii(r.iban||'').toLowerCase()===q.replace(/\s/g,''));if(r)rec[f.k]=r.id;else warns.push(f.l+': ni najdeno «'+raw+'»');break}
case'refs':rec[f.k]=String(raw).split(/[;,]/).map(x=>ascii(x).toLowerCase().trim()).filter(Boolean).map(q=>live(f.coll).find(r=>ascii(labelOf(f.coll,r)).toLowerCase()===q)?.id).filter(Boolean);break;
case'tags':rec[f.k]=String(raw).split(/[;,]/).map(x=>x.trim()).filter(Boolean);break;
case'file':case'files':case'img':case'items':break;
case'email':if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(raw).trim()))errs.push(f.l+': neveljaven e-naslov «'+raw+'»');else rec[f.k]=String(raw).trim();break;
case'iban':if(!IBANok(raw))warns.push(f.l+': IBAN se ne ujema');rec[f.k]=String(raw).trim();break;
default:rec[f.k]=String(raw).trim()}}
for(const f of sc.f)if(f.req&&!f.hid&&(rec[f.k]==null||rec[f.k]===''||rec[f.k]===undefined)&&f.def===undefined)errs.push(f.l+': manjka obvezna vrednost');
return{rec:{...defaults(sc),...rec},errs,warns}}
A.import=el=>{const c=el.dataset.c;IMP={c,rows:[],cols:[],map:{}};modal({title:'Uvoz podatkov: '+t(SC[c].t),wide:1,body:`<p>Podprte oblike: CSV, Excel (.xlsx), JSON, Word (.docx – prva tabela)${c==='bank_tx'?', bančni izpisek XML (camt.053)':''}. Sledi preslikava stolpcev in predogled z validacijo – uvoz je mogoče razveljaviti.</p><input type="file" id="impf" accept=".csv,.txt,.xlsx,.xls,.json,.docx,.xml" data-ch="impfile"><div id="impb"></div>`})};
CH.impfile=async el=>{const file=el.files[0];if(!file)return;const n=file.name.toLowerCase();let rows=[];
try{if(n.endsWith('.json')){const j=JSON.parse(await file.text());rows=Array.isArray(j)?j:(j.rows||[])}
else if(n.endsWith('.xlsx')||n.endsWith('.xls')){if(!window.XLSX)throw new Error('Excel knjižnica ni dosegljiva.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true})}
else if(n.endsWith('.docx')){if(!window.mammoth)throw new Error('Knjižnica za Word ni dosegljiva.');const h=(await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()})).value;const d=new DOMParser().parseFromString(h,'text/html');const tr=[...d.querySelectorAll('table tr')].map(r=>[...r.children].map(c=>c.textContent.trim()));if(tr.length<2)throw new Error('V dokumentu ni tabele.');rows=tr.slice(1).map(r=>Object.fromEntries(tr[0].map((h,i)=>[h,r[i]??''])))}
else if(n.endsWith('.xml')){const d=new DOMParser().parseFromString(await file.text(),'text/xml');rows=[...d.getElementsByTagNameNS('*','Ntry')].map(e=>{const q=(p,ctx=e)=>ctx.getElementsByTagNameNS('*',p)[0]?.textContent||'';const cd=q('CdtDbtInd')==='DBIT';const a=num(q('Amt'));const pt=e.getElementsByTagNameNS('*',cd?'Cdtr':'Dbtr')[0];return{Datum:q('Dt'),Znesek:cd?-a:a,'Nasprotna stranka':pt?q('Nm',pt):'',IBAN:q('IBAN'),Sklic:q('Ref')||q('EndToEndId'),Namen:q('Ustrd')}})}
else{const t=csvParse(await file.text());rows=t.slice(1).map(r=>Object.fromEntries(t[0].map((h,i)=>[h.trim(),r[i]??''])))}}
catch(e){return toast('Branje datoteke ni uspelo: '+e.message,'err',6000)}
if(!rows.length)return toast('Datoteka je prazna.','warn');IMP.rows=rows;IMP.cols=Object.keys(rows[0]);const sc=SC[IMP.c];IMP.map={};
for(const f of sc.f){if(f.hid||f.calc||f.ro)continue;const m=IMP.cols.find(c=>ascii(c).toLowerCase()===ascii(f.l).toLowerCase())||IMP.cols.find(c=>c===f.k)||IMP.cols.find(c=>ascii(c).toLowerCase()===ascii(f.k).toLowerCase());if(m)IMP.map[f.k]=m}
if(IMP.c==='bank_tx'){IMP.map.date='Datum';IMP.map.amount='Znesek';IMP.map.counterparty='Nasprotna stranka';IMP.map.iban='IBAN';IMP.map.reference='Sklic';IMP.map.purpose='Namen'}
impDraw()};
function impDraw(){const sc=SC[IMP.c];const fs=sc.f.filter(f=>!f.hid&&!f.calc&&!f.ro&&!['file','files','img','items','password'].includes(f.t));
const conv=IMP.rows.map(r=>impConv(sc,r,IMP.map));const bad=conv.filter(x=>x.errs.length).length,warn=conv.filter(x=>x.warns.length).length;IMP.conv=conv;
$('#impb').innerHTML=`<h3 style="margin:12px 0 6px">1. Preslikava stolpcev (${IMP.rows.length} vrstic)</h3><div class="fg">${fs.map(f=>`<div class="fld"><label>${esc(f.l)}${f.req?' *':''}</label><select data-ch="impmap" data-k="${f.k}"><option value="">– ne uvozi –</option>${IMP.cols.map(c=>`<option${IMP.map[f.k]===c?' selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')}</div>
<h3 style="margin:14px 0 6px">2. Predogled in validacija</h3><div class="chips"><span class="chip">Veljavnih: <b class="ok">${conv.length-bad}</b></span><span class="chip">Z napakami: <b class="er">${bad}</b></span><span class="chip">Z opozorili: <b>${warn}</b></span></div>
<div class="tw"><table class="tbl sm"><thead><tr><th>#</th>${fs.filter(f=>IMP.map[f.k]).map(f=>`<th>${esc(f.l)}</th>`).join('')}<th>Opombe</th></tr></thead><tbody>${conv.slice(0,15).map((x,i)=>`<tr${x.errs.length?' style="background:var(--erb)"':x.warns.length?' style="background:var(--wrb)"':''}><td>${i+1}</td>${fs.filter(f=>IMP.map[f.k]).map(f=>`<td>${esc(fv(f,x.rec[f.k]))}</td>`).join('')}<td>${esc([...x.errs,...x.warns].join('; '))}</td></tr>`).join('')}</tbody></table></div>
<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-a="closeModal">Prekliči</button><button class="btn pri" data-a="impGo">Uvozi ${conv.length-bad} vrstic</button></div>`}
CH.impmap=el=>{IMP.map[el.dataset.k]=el.value;impDraw()};

function bankHit(tx){const ref=String(tx.reference||'').replace(/\D/g,'');const cp=ascii(tx.counterparty||'').toLowerCase(),a=num(tx.amount);
const fees=live('fees').filter(f=>!['plačano','stornirano'].includes(f.status)),invs=live('invoices').filter(i=>i.direction==='izdan'&&!['plačan','storniran','osnutek'].includes(i.status));
if(ref.length>=4){const f=fees.find(f=>String(f.reference||'').replace(/\D/g,'')===ref);if(f)return{coll:'fees',id:f.id,why:'sklic'};const i=invs.find(i=>String(i.reference||'').replace(/\D/g,'')===ref||(i.number||'').replace(/\D/g,'')===ref);if(i)return{coll:'invoices',id:i.id,why:'sklic'}}
const f=fees.find(f=>{const m=get('members',f.member);return m&&cp.includes(ascii(m.last||'').toLowerCase())&&cp.includes(ascii(m.first||'').toLowerCase())&&Math.abs(num(f.total)-num(f.paid)-a)<.01});if(f)return{coll:'fees',id:f.id,why:'ime in znesek'};return null}
ACTS.bankSuggest=(c,silent)=>{let n=0;for(const tx of live('bank_tx').filter(x=>['neusklajeno','predlagano'].includes(x.status)&&num(x.amount)>0)){const h=bankHit(tx);if(h){tx.suggest=JSON.stringify(h);tx.status='predlagano';n++}else if(tx.status==='predlagano'){tx.status='neusklajeno';tx.suggest=''}}Store.mark('bank_tx');S.rev++;if(!silent){render();toast(`Predlogov povezav: ${n}`)}};
BULK.bankSuggest=(c)=>ACTS.bankSuggest(c);

/* kartice */
function cardHTML(m){const o=S.st.org,vu=Rules.validUntil(m);if(!m.card_token){m.card_token=rndTok(12);Store.mark('members')}const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'?preveri='+m.card_token;
return `<div class="crd">${o.logo?`<img class="lg" src="${o.logo}" alt="">`:`<b>${esc(o.short||'PGD')}</b>`}<div><div style="font-size:9px;letter-spacing:.05em">ČLANSKA KARTICA</div><div class="nm">${esc(labelOf('members',m))}</div><div>Št. ${esc(m.number||'')} · ${esc(lbl('membership_categories',m.category))}</div><div>Veljavna do: ${vu==='9999-12-31'?'trajno':(fmtD(vu)||'–')}</div></div><div class="qr">${qrSvg(url,3)}</div></div>`}
TABS.card={t:'Članska kartica',fn:m=>`<div class="card">${cardHTML(m)}<p style="margin-top:10px"><button class="btn pri" data-a="cardPrint" data-id="${m.id}">🖨 Natisni kartico (PDF)</button></p><p class="mu" style="font-size:.85rem">QR koda vodi na javno preverjanje veljavnosti (potrebna je objava javnih podatkov v Nastavitvah).</p></div>`};
A.cardPrint=el=>printHTML('Članska kartica',`<div class="grid">${cardHTML(get('members',el.dataset.id))}</div>`,{css:CARD_CSS,noTitle:1,noHead:1});
BULK.cards=(c,ids)=>printHTML('Članske kartice',`<div class="grid">${ids.map(i=>cardHTML(get('members',i))).join('')}</div>`,{css:CARD_CSS,noTitle:1,noHead:1});
/* projekti: plan vs dejansko */
function planRows(pid){const bl=live('project_budgets').filter(b=>b.project===pid),led=live('ledger').filter(l=>l.project===pid);const cats=[...new Set([...bl.map(b=>b.kind+'|'+b.category),...led.map(l=>l.type+'|'+l.category)])];
return cats.map(k=>{const[kind,cat]=k.split('|');const planned=sum(bl.filter(b=>b.kind===kind&&b.category===cat),b=>b.planned);const actual=sum(led.filter(l=>l.type===kind&&l.category===cat),l=>l.amount);return{kind,cat,planned,actual}}).sort((a,b)=>a.kind.localeCompare(b.kind)||a.cat.localeCompare(b.cat))}
TABS.plan={t:'Plan in dejansko',fn:p=>{const rows=planRows(p.id);const ex=rows.filter(r=>r.kind==='odhodek'),inc=rows.filter(r=>r.kind==='prihodek');const tb=(rs,ti)=>`<h3>${ti}</h3><div class="tw"><table class="tbl sm"><thead><tr><th>Kategorija</th><th class="r">Načrtovano</th><th class="r">Dejansko</th><th class="r">Razlika</th><th class="r">Poraba</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.cat)}</td><td class="r">${fmtM(r.planned)}</td><td class="r">${fmtM(r.actual)}</td><td class="r ${r.actual>r.planned&&r.kind==='odhodek'?'er':''}">${fmtM(r.planned-r.actual)}</td><td class="r">${r.planned?Math.round(r.actual/r.planned*100)+' %':'–'}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Ni postavk.</td></tr>'}</tbody><tfoot><tr><td>Skupaj</td><td class="r">${fmtM(sum(rs,r=>r.planned))}</td><td class="r">${fmtM(sum(rs,r=>r.actual))}</td><td class="r">${fmtM(sum(rs,r=>r.planned-r.actual))}</td><td></td></tr></tfoot></table></div>`;
S.tbl=S.tbl||{};S.tbl.plan={title:'Plan in dejansko: '+p.name,cols:['Vrsta','Kategorija','Načrtovano','Dejansko'],rows:rows.map(r=>[r.kind,r.cat,fmtM(r.planned),fmtM(r.actual)])};
S.after.push(()=>mkChart('pch',{type:'bar',data:{labels:ex.map(r=>r.cat),datasets:[{label:'Načrtovano',data:ex.map(r=>r.planned),backgroundColor:'#7fa8d6'},{label:'Dejansko',data:ex.map(r=>r.actual),backgroundColor:'#e9a020'}]},options:{responsive:true,maintainAspectRatio:false}}));
return `<div class="card"><div class="chd"><h2>Proračun projekta</h2>${exportMenu('plan')}</div>${tb(ex,'Odhodki')}${tb(inc,'Prihodki')}<div class="cb" style="height:260px;margin-top:12px"><canvas id="pch"></canvas></div></div>`}};
TABS.pkb={t:'Kanban nalog',fn:p=>{const ts=live('tasks').filter(t=>t.project===p.id);return `<div class="kb">${wfOf('task').map(s=>{const rs=ts.filter(t=>t.status===s);return `<div class="kc" data-col="${esc(s)}" data-c="tasks"><h3>${badge(s)}<span class="mu">${rs.length}</span></h3>${rs.map(r=>`<div class="kcard" draggable="true" data-id="${r.id}" data-c="tasks"><a href="#/m/tasks/${r.id}"><b>${esc(r.title)}</b></a><br><small>${esc([lbl('members',r.assignee),r.due&&fmtD(r.due)].filter(Boolean).join(' · '))}</small></div>`).join('')}</div>`}).join('')}</div>`}};
SC.projects.xt=['plan','pkb'];
/* ---------- strani ---------- */
const PAL=['#b3161b','#e9a020','#2c8a4b','#c2372f','#7b4bb3','#0a8f9f','#8a5a2b','#5c6b7d','#d45087','#6a9f2a'];
function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;if(!window.Chart){el.parentElement.style.height='auto';el.parentElement.innerHTML='<p class="mu">Grafi niso na voljo (knjižnica Chart.js ni naložena – potrebna je internetna povezava).</p>';return}Chart.defaults.color=getComputedStyle(document.body).getPropertyValue('--mu').trim()||'#586a7c';Chart.defaults.borderColor=getComputedStyle(document.body).getPropertyValue('--bd').trim();S.charts.push(new Chart(el,cfg))}
const mrange=(from,to)=>{const a=[];let d=from.slice(0,7);while(d<=to.slice(0,7)&&a.length<600){a.push(d);const[y,m]=d.split('-').map(Number);d=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`}return a};
const lastMonths=n=>{const d=new Date();const a=[];for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`)}return a};
const MNAME=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
const mlab=m=>MNAME[+m.slice(5,7)-1]+' '+m.slice(2,4);
const cartesian={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};

/* obvestila */
function computeNotifs(){const R=S.st.rules.reminderDays,out=[],td=today();const add=(sev,ic,text,href,date)=>out.push({sev,ic,text,href,date:date||''});
const lat=(coll,kf)=>{const m={};live(coll).forEach(r=>{const k=kf(r);if(!m[k]||(r.valid||'')>(m[k].valid||''))m[k]=r});return Object.values(m)};
const dl=(mod,list,coll,key,what,ic,n,nm)=>{if(!can(mod))return;list.filter(r=>r[key]&&!['izločeno','odpisano','izven uporabe'].includes(r.status)).forEach(r=>{const d=daysTo(r[key]);if(d<0)add('er',ic,`${what} – rok potekel ${fmtD(r[key])}: ${nm(r)}`,`#/m/${coll}/${r.id}`,r[key]);else if(d<=n)add('wr',ic,`${what} do ${fmtD(r[key])}: ${nm(r)}`,`#/m/${coll}/${r.id}`,r[key])})};
const vh0=live('vehicles'),nmv=r=>(r.name||'')+(r.reg?' ('+r.reg+')':''),actM=r=>get('members',r.member)?.status==='aktiven';
if(can('duties'))live('duties').filter(x=>x.start&&!['odpovedano','izvedeno'].includes(x.status)).forEach(x=>{const d=daysTo(x.start);if(d>=0&&d<=14&&!(x.crew||[]).length)add('wr','📋',`Dežurstvo brez razporejenih gasilcev ${fmtD(x.start)}: ${x.title}`,'#/m/duties/'+x.id,x.start)});
if(can('competitions'))live('competitions').filter(x=>x.status==='načrtovano'&&x.date>=today()&&daysTo(x.date)<=30).forEach(x=>add('in','🏆',`Tekmovanje ${fmtD(x.date)}: ${x.name}`,'#/m/competitions/'+x.id,x.date));
dl('fleet',vh0,'vehicles','tp','Tehnični pregled vozila','🚒',30,nmv);dl('fleet',vh0,'vehicles','ins_until','Zavarovanje vozila','🚒',30,nmv);dl('fleet',vh0,'vehicles','service_due','Servis vozila','🔧',30,nmv);
dl('equipment',live('equipment'),'equipment','next_check','Pregled opreme','🛠',30,r=>labelOf('equipment',r));
dl('hydrants',live('hydrants'),'hydrants','next','Pregled hidranta','🚰',30,r=>labelOf('hydrants',r));
dl('medical',lat('medicals',r=>r.member+'|'+r.type).filter(actM),'medicals','valid','Zdravniški pregled','🩺',60,r=>lbl('members',r.member));
dl('training',lat('qualifications',r=>r.member+'|'+r.kind+'|'+r.name).filter(r=>r.kind!=='čin').filter(actM),'qualifications','valid','Usposobljenost','🎖',60,r=>labelOf('qualifications',r));
if(can('membership')){const open=live('fees').filter(f=>!['plačano','stornirano'].includes(f.status)&&f.due);open.filter(f=>f.due<td).forEach(f=>add('er','💶',`Zapadla članarina: ${lbl('members',f.member)} (${f.year}), ${fmtM(num(f.total)-num(f.paid))}`,'#/m/fees/'+f.id,f.due));open.filter(f=>f.due>=td&&daysTo(f.due)<=R.fees).forEach(f=>add('wr','💶',`Članarina zapade ${fmtD(f.due)}: ${lbl('members',f.member)}`,'#/m/fees/'+f.id,f.due));
live('members').filter(m=>m.status==='aktiven').forEach(m=>{const vu=Rules.validUntil(m);if(vu&&vu!=='9999-12-31'&&daysTo(vu)>=0&&daysTo(vu)<=R.memberExpiry)add('wr','⏳',`Članstvo poteče ${fmtD(vu)}: ${labelOf('members',m)}`,'#/m/members/'+m.id,vu)})}
if(can('invoices')){live('invoices').filter(i=>!['plačan','storniran','osnutek'].includes(i.status)&&i.due).forEach(i=>{const d=daysTo(i.due);if(d<0)add('er','🧾',`Zapadel ${i.direction==='prejet'?'prejeti ':''}račun ${i.number||''}: ${i.buyer||''} (${fmtM(num(i.total)-num(i.paid))})`,'#/m/invoices/'+i.id,i.due);else if(d<=R.invoices)add('wr','🧾',`Račun ${i.number||''} zapade ${fmtD(i.due)}`,'#/m/invoices/'+i.id,i.due)})}
if(can('expenses','APPROVE'))live('expense_claims').filter(c=>['oddano','pregled'].includes(c.status)).forEach(c=>add('in','🧳',`Povračilo čaka na odobritev: ${c.purpose} (${fmtM(c.amount)})`,'#/m/expense_claims/'+c.id,c.date));
if(can('events'))live('events').filter(e=>e.date>=td&&daysTo(e.date)<=R.events&&!['odpovedan','izveden'].includes(e.status)).forEach(e=>add('in','📅',`Dogodek ${fmtD(e.date)}: ${e.title}`,'#/m/events/'+e.id,e.date));
if(can('projects'))live('projects').filter(p=>p.status==='aktiven'&&p.end).forEach(p=>{const d=daysTo(p.end);if(d<0)add('er','🗂',`Projekt je presegel rok: ${p.name}`,'#/m/projects/'+p.id,p.end);else if(d<=R.projects)add('wr','🗂',`Projekt se zaključuje ${fmtD(p.end)}: ${p.name}`,'#/m/projects/'+p.id,p.end)});
if(can('tasks')){let ts=live('tasks').filter(t=>t.status!=='zaključena'&&t.due);if(isOwn('tasks'))ts=ts.filter(t=>t.assignee===S.user.member);ts.forEach(t=>{const d=daysTo(t.due);if(d<0)add('er','✅',`Zamujena naloga: ${t.title}`,'#/m/tasks/'+t.id,t.due);else if(d<=R.tasks)add('wr','✅',`Rok naloge ${fmtD(t.due)}: ${t.title}`,'#/m/tasks/'+t.id,t.due)})}
if(can('grants'))live('grants').filter(g=>g.deadline&&['spremljamo','priprava'].includes(g.status)&&daysTo(g.deadline)>=0&&daysTo(g.deadline)<=R.grants).forEach(g=>add('wr','📢',`Rok razpisa ${fmtD(g.deadline)}: ${g.name}`,'#/m/grants/'+g.id,g.deadline));
if(can('contracts'))live('contracts').filter(c=>c.end&&c.status==='veljavna'&&daysTo(c.end)>=0&&daysTo(c.end)<=R.contracts).forEach(c=>add('wr','📑',`Pogodba poteče ${fmtD(c.end)}: ${c.title}`,'#/m/contracts/'+c.id,c.end));
if(can('equipment')){live('equipment').filter(e=>e.warranty&&daysTo(e.warranty)>=0&&daysTo(e.warranty)<=R.warranty).forEach(e=>add('wr','🛠',`Garancija poteče ${fmtD(e.warranty)}: ${e.name}`,'#/m/equipment/'+e.id,e.warranty));live('equipment_loans').filter(l=>l.status==='izposojeno'&&l.planned&&l.planned<td).forEach(l=>add('er','📤',`Zamuda vračila opreme: ${lbl('equipment',l.equipment)} (${lbl('members',l.borrower)})`,'#/m/equipment_loans/'+l.id,l.planned))}
if(can('library'))live('library_loans').filter(l=>l.status==='izposojeno'&&l.due&&l.due<td).forEach(l=>add('er','📖',`Zamuda vračila gradiva: ${lbl('library',l.item)}`,'#/m/library_loans/'+l.id,l.due));
if(can('gdpr'))live('gdpr_requests').filter(r=>['prejeto','v obdelavi'].includes(r.status)&&r.deadline&&daysTo(r.deadline)<=7).forEach(r=>add('er','📨',`GDPR zahteva (${r.type}) – rok ${fmtD(r.deadline)}`,'#/m/gdpr_requests/'+r.id,r.deadline));
live('comments').filter(c=>c.text?.includes('@'+S.user?.username)&&c.user!==S.user?.username&&daysTo(c.at.slice(0,10))>-14).forEach(c=>add('in','💬',`${c.user} vas je omenil: ${c.text.slice(0,60)}`,`#/m/${c.coll}/${c.rec}?tab=com`,c.at.slice(0,10)));
if(can('communications')){const n=live('communications').filter(c=>c.status==='osnutek'&&c.auto).length;if(n)add('in','✉',`Samodejno pripravljeni osnutki sporočil: ${n}`,'#/m/communications?status=osnutek','')}
const o={er:0,wr:1,in:2};return out.sort((a,b)=>o[a.sev]-o[b.sev]||(a.date||'').localeCompare(b.date||''))}
function pNotifs(){S.crumb=[[t('Obvestila')]];const ns=computeNotifs();S.tbl={notifs:{title:'Obvestila',cols:['Nujnost','Obvestilo','Datum'],rows:ns.map(n=>[{er:'nujno',wr:'opozorilo',in:'info'}[n.sev],n.text,fmtD(n.date)])}};
return pageHead(t('Obvestila'),exportMenu('notifs')+`<button class="btn" data-a="runAuto">⚙ Zaženi dnevna preverjanja</button>`)+(ns.length?`<div class="card">${ns.map(n=>`<a href="${n.href}" style="display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd);color:var(--tx)"><span>${n.ic}</span><span style="flex:1">${esc(n.text)}</span><span class="bd ${n.sev}">${fmtD(n.date)||'–'}</span></a>`).join('')}</div>`:'<div class="card empty">Ni obvestil. 👍</div>')}

/* nadzorna plošča */
const kpi=(l,v,s,h,c='')=>`<a class="kpi ${c}" href="${h||'#'}"><div class="kl">${esc(t(l))}</div><div class="kv">${v}</div>${s?`<div class="ks">${s}</div>`:''}</a>`;
function pDash(){const y=String(S.year),td=today();S.crumb=[];const sec=[];
const led=live('ledger').filter(l=>l.status!=='storno'&&(l.date||'').startsWith(y));
if(can('members')){const ms=live('members'),act=ms.filter(m=>m.status==='aktiven');const exp=ms.filter(SC.members.flags.expired).length;
sec.push(['members',`<section class="card"><h2>Članstvo</h2><div class="kg">${kpi('Aktivni člani',act.length,'skupaj '+ms.length,'#/m/members?status=aktiven')}${kpi('Novi člani '+y,ms.filter(SC.members.flags.newy).length,'','#/m/members?flag=newy')}${kpi('Brez veljavne članarine',exp,'','#/m/members?flag=expired',exp?'wr':'')}${can('membership')?kpi('Zapadle članarine',live('fees').filter(f=>!['plačano','stornirano'].includes(f.status)&&f.due&&f.due<td).length,'','#/m/fees?status=zapadlo','er'):''}</div><div class="cg"><div class="cb"><canvas id="d1"></canvas></div><div class="cb"><canvas id="d2"></canvas></div></div></section>`]);
S.after.push(()=>{const cats={};act.forEach(m=>{const k=lbl('membership_categories',m.category)||'–';cats[k]=(cats[k]||0)+1});mkChart('d1',{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:PAL}]},options:{...cartesian,plugins:{legend:{position:'bottom'},title:{display:true,text:'Člani po kategorijah'}}}});
const mo=lastMonths(12);mkChart('d2',{type:'line',data:{labels:mo.map(mlab),datasets:[{label:'Člani (skupaj)',data:mo.map(m=>ms.filter(x=>(x.joined||'').slice(0,7)<=m&&(!x.ended||x.ended.slice(0,7)>m)).length),borderColor:PAL[0],fill:false,tension:.2}]},options:{...cartesian,plugins:{legend:{display:false},title:{display:true,text:'Rast članstva'}}}})})}
if(can('finance')||can('cash')||can('invoices')){const inc=sum(led.filter(l=>l.type==='prihodek'),l=>l.amount),ex=sum(led.filter(l=>l.type==='odhodek'),l=>l.amount);const cash=live('cash');const cb=num(S.st.org.cashOpening)+sum(cash.filter(x=>x.type==='prejemek'),x=>x.amount)-sum(cash.filter(x=>x.type==='izdatek'),x=>x.amount);const bank=sum(live('bank_accounts'),a=>a.opening)+sum(live('bank_tx'),x=>x.amount);
const recv=sum(live('invoices').filter(i=>i.direction==='izdan'&&!['osnutek','plačan','storniran'].includes(i.status)),i=>num(i.total)-num(i.paid))+sum(live('fees').filter(f=>!f.invoice&&!['plačano','stornirano'].includes(f.status)),f=>num(f.total)-num(f.paid));const pay=sum(live('invoices').filter(i=>i.direction==='prejet'&&!['osnutek','plačan','storniran'].includes(i.status)),i=>num(i.total)-num(i.paid))+sum(live('expense_claims').filter(c=>c.status==='odobreno'),c=>c.amount);
sec.push(['finance',`<section class="card"><h2>Finance ${y}</h2><div class="kg">${kpi('Prihodki',fmtM(inc),'','#/m/ledger?type=prihodek','ok')}${kpi('Odhodki',fmtM(ex),'','#/m/ledger?type=odhodek','er')}${kpi('Saldo',fmtM(inc-ex),'','#/m/ledger')}${kpi('Stanje blagajne',fmtM(cb),'','#/m/cash')}${kpi('Stanje bančnih računov',fmtM(bank),'','#/m/bank_accounts')}${kpi('Odprte terjatve',fmtM(recv),'','#/m/invoices','wr')}${kpi('Odprte obveznosti',fmtM(pay),'','#/m/invoices?direction=prejet','wr')}</div><div class="cb" style="height:260px"><canvas id="d3"></canvas></div></section>`]);
S.after.push(()=>{const mo=mrange(y+'-01',y+'-12');mkChart('d3',{type:'bar',data:{labels:mo.map(mlab),datasets:[{label:'Prihodki',data:mo.map(m=>sum(led.filter(l=>l.type==='prihodek'&&l.date.slice(0,7)===m),l=>l.amount)),backgroundColor:'#2c8a4b'},{label:'Odhodki',data:mo.map(m=>sum(led.filter(l=>l.type==='odhodek'&&l.date.slice(0,7)===m),l=>l.amount)),backgroundColor:'#c2372f'}]},options:cartesian})})}
if(can('projects')){const ps=live('projects'),act=ps.filter(p=>p.status==='aktiven');const pl=sum(live('project_budgets').filter(b=>b.kind==='odhodek'&&act.some(p=>p.id===b.project)),b=>b.planned),sp=sum(live('ledger').filter(l=>l.type==='odhodek'&&act.some(p=>p.id===l.project)),l=>l.amount);
sec.push(['projects',`<section class="card"><h2>Projekti</h2><div class="kg">${kpi('Aktivni projekti',act.length,'skupaj '+ps.length,'#/m/projects?status=aktiven')}${kpi('Poraba proračuna',pl?Math.round(sp/pl*100)+' %':'–',fmtM(sp)+' od '+fmtM(pl),'#/m/project_budgets')}${can('tasks')?kpi('Zamujene naloge',live('tasks').filter(SC.tasks.flags.overdue).length,'','#/m/tasks?flag=overdue','er'):''}${can('grants')?kpi('Razpisi v pripravi',live('grants').filter(g=>['spremljamo','priprava'].includes(g.status)).length,'','#/m/grants'):''}</div></section>`])}
if(can('events')){const ev=live('events').filter(e=>e.date>=td&&e.status!=='odpovedan').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);sec.push(['events',`<section class="card"><h2>Prihajajoči dogodki</h2>${ev.length?`<table class="tbl sm"><tbody>${ev.map(e=>`<tr class="rw" data-a="open" data-c="events" data-id="${e.id}"><td class="nw">${fmtD(e.date)}</td><td>${esc(e.title)}</td><td>${live('registrations').filter(r=>r.event===e.id&&['prijavljen','potrjen'].includes(r.status)).length}${e.capacity?' / '+e.capacity:''} prijav</td><td>${badge(e.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="mu">Ni načrtovanih dogodkov.</p>'}</section>`])}

SUB.cin=f=>{const q=ascii(f.code.value).toLowerCase().trim();if(!q)return;const rs=live('registrations').filter(r=>r.event===f.dataset.id&&r.status!=='odpovedan');const r=rs.find(x=>(x.code||'').toLowerCase()===q)||rs.find(x=>ascii(x.name||lbl('members',x.member)).toLowerCase().includes(q));if(!r)return toast('Udeleženec ni najden.','err');if(r.status==='čakalna lista')toast('Opozorilo: oseba je na čakalni listi.','warn');saveRec('registrations',{id:r.id,attended:true});toast('✔ '+(r.name||lbl('members',r.member)));render();setTimeout(()=>$('#cin')?.focus(),50)};

A.scan=async el=>{if(!('BarcodeDetector' in window))return toast('Ta brskalnik ne podpira skeniranja QR – vnesite kodo ročno.','warn',6000);
const m=modal({title:'Skeniraj QR kodo',body:'<video id="scv" autoplay playsinline style="width:100%;border-radius:8px"></video>'});let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){closeModal();return toast('Dostop do kamere ni odobren.','err')}
const v=$('#scv');v.srcObject=stream;const det=new BarcodeDetector({formats:['qr_code']});let last='';const loop=async()=>{if(!document.body.contains(v)){stream.getTracks().forEach(t=>t.stop());return}try{const c=await det.detect(v);if(c[0]&&c[0].rawValue!==last){last=c[0].rawValue;const f=document.createElement('form');f.dataset.id=el.dataset.id;f.innerHTML='<input name="code">';f.code.value=last;SUB.cin(f)}}catch(e){}setTimeout(loop,500)};loop()};

<div class="card"><h3>Dogodki</h3>${ev.length?`<table class="tbl sm"><tbody>${ev.slice(0,10).map(e=>{const r=regs.find(x=>x.event===e.id&&x.status!=='odpovedan');return `<tr><td>${fmtD(e.date)}</td><td>${esc(e.title)}<br><small class="mu">${esc(e.location||'')}</small></td><td class="r">${r?badge(r.status):`<button class="btn sm pri" data-a="portalReg" data-id="${e.id}">Prijava</button>`}</td></tr>`}).join('')}</tbody></table>`:'<p class="mu">Ni načrtovanih dogodkov.</p>'}</div>

const fillT=(s,ctx)=>String(s||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>ctx[k]??'');
const baseCtx=m=>({drustvo:S.st.org.name||'',ime:m?.first||'',priimek:m?.last||'',stevilka:m?.number||''});
const memRecip=m=>m.email?{name:labelOf('members',m),email:m.email,member:m.id,ctx:baseCtx(m)}:null;
function segRecipients(seg,p){let ms=live('members').filter(m=>m.status==='aktiven');
if(seg==='cat')ms=ms.filter(m=>m.category===p);else if(seg==='body')ms=live('members').filter(m=>live('bodies').some(b=>b.member===m.id&&b.body===p&&b.status==='aktiven'));
else if(seg==='project'){const ids=new Set([get('projects',p)?.leader,...live('tasks').filter(t=>t.project===p).flatMap(t=>[t.assignee,...(t.collab||[])]),...live('volunteer_hours').filter(h=>h.project===p).map(h=>h.member)].filter(Boolean));ms=live('members').filter(m=>ids.has(m.id))}
else if(seg==='event')return live('registrations').filter(r=>r.event===p&&r.status!=='odpovedan').map(r=>{const m=get('members',r.member);const em=r.email||m?.email;return em?{name:r.name||labelOf('members',m),email:em,member:r.member,ctx:baseCtx(m)}:null}).filter(Boolean);
else if(seg==='tag')ms=live('members').filter(m=>(m.tags||[]).includes(p));
return ms.map(memRecip).filter(Boolean)}
const cmpRecips=()=>{const c=S.cmp;const rs=c.recipients||segRecipients($('#cseg')?.value||'active',$('#cpar')?.value||'');const seen=new Set();return rs.filter(r=>!seen.has(r.email)&&seen.add(r.email))};
function cmpParam(seg){const opt=(a)=>a.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
if(seg==='cat')return opt(live('membership_categories').map(c=>[c.id,c.name]));if(seg==='body')return opt(S.st.lists.bodies.map(b=>[b,b]));if(seg==='project')return opt(live('projects').map(p=>[p.id,p.name]));if(seg==='event')return opt(live('events').map(e=>[e.id,fmtD(e.date)+' '+e.title]));if(seg==='tag')return opt([...new Set(live('members').flatMap(m=>m.tags||[]))].map(x=>[x,x]));return''}
function compose(o={}){S.cmp={recipients:o.recipients||null,related:o.relatedColl?{c:o.relatedColl,ids:o.relatedIds}:null};const tp=live('email_templates');const tpl=tp.find(x=>x.key===o.template);
const body=`<form id="cf" class="fg" data-sub="noop">${o.recipients?`<div class="fld full"><b>Prejemniki:</b> <span id="cn"></span></div>`:`<div class="fld"><label>Skupina prejemnikov</label><select id="cseg" data-ch="cmpSeg"><option value="active">Vsi aktivni člani</option><option value="cat">Kategorija članstva</option><option value="body">Člani organa</option><option value="project">Projektna skupina</option><option value="event">Udeleženci dogodka</option><option value="tag">Oznaka</option></select></div><div class="fld"><label>Podrobnost</label><select id="cpar" data-ch="cmpSeg"></select></div><div class="fld full"><b>Prejemniki:</b> <span id="cn"></span></div>`}
<div class="fld"><label>Vrsta</label><select id="ctype"><option>e-pošta</option><option>obvestilo</option><option>interna objava</option><option>SMS</option></select></div><div class="fld"><label>Predloga</label><select id="ctpl" data-ch="cmpTpl"><option value="">– brez –</option>${tp.map(x=>`<option value="${x.id}"${tpl&&tpl.id===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div>

modal({title:'Novo sporočilo',wide:1,body,foot:`<button class="btn" data-a="closeModal">Prekliči</button><button class="btn" data-a="cmpSend" data-m="draft">Shrani osnutek</button><button class="btn" data-a="cmpSend" data-m="mailto">✉ Odpri v e-pošti (BCC)</button><button class="btn pri" data-a="cmpSend" data-m="webhook"${S.st.email.webhook?'':' disabled title="Nastavite spletno povezavo"'}>Pošlji prek povezave</button>`});if(!o.recipients)CH.cmpSeg({id:'init'});cmpCount();if(tpl&&!o.body)CH.cmpTpl($('#ctpl'))}

A.cmpSend=async el=>{const m=el.dataset.m,rs=cmpRecips();const sub=$('#csub').value,body=$('#cbody').value;if(!sub)return toast('Vnesite zadevo.','warn');if(m!=='draft'&&!rs.length)return toast('Ni prejemnikov.','warn');
const rec={type:$('#ctype').value,subject:sub,body,date:today(),recipients:rs.map(r=>`${r.name} <${r.email}>`).join('\n'),to_n:rs.length,template:get('email_templates',$('#ctpl').value)?.name||'',related:JSON.stringify(S.cmp.related||{}),status:'osnutek'};
if(m==='mailto'){const one=rs.length===1?rs[0].ctx:{drustvo:S.st.org.name};const url=`mailto:?bcc=${encodeURIComponent(rs.map(r=>r.email).join(','))}&subject=${encodeURIComponent(fillT(sub,one))}&body=${encodeURIComponent(fillT(body,one))}`;if(url.length>1900){try{await navigator.clipboard.writeText(rs.map(r=>r.email).join(', '))}catch(e){}toast('Seznam naslovov je v odložišču – prilepite ga v polje BCC.','warn',7000);location.href=`mailto:?subject=${encodeURIComponent(fillT(sub,one))}&body=${encodeURIComponent(fillT(body,one)).slice(0,1500)}`}else location.href=url;rec.status='pripravljeno'}
else if(m==='webhook'){let ok=0;for(const r of rs){try{await fetch(S.st.email.webhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({to:r.email,name:r.name,subject:fillT(sub,r.ctx||{}),body:fillT(body,r.ctx||{}),from:S.st.email.from})});ok++}catch(e){}}rec.status=ok===rs.length?'poslano':'napaka';toast(`Poslano: ${ok} / ${rs.length}`,ok===rs.length?'ok':'warn')}

/* avtomatizacije */
function runAutomations(manual){const td=today(),R=S.st.rules.reminderDays;let a=0,b=0,d=0;
live('fees').forEach(f=>{if(['izdano','poslano'].includes(f.status)&&f.due&&f.due<td){f.status='zapadlo';f.updated_at=nowISO();a++}});if(a)Store.mark('fees');
live('invoices').forEach(i=>{if(['izdan','poslan'].includes(i.status)&&i.due&&i.due<td){i.status='zapadel';i.updated_at=nowISO();b++}});if(b)Store.mark('invoices');
const tpl=live('email_templates').find(x=>x.key==='fee_reminder');
live('fees').filter(f=>f.status==='zapadlo'&&(!f.last_reminder||daysTo(f.last_reminder)<=-30)).forEach(f=>{const m=get('members',f.member);if(!m?.email)return;const ctx=ctxOf('fees',f);(S.db.communications||(S.db.communications=[])).push({id:uid(),created_at:nowISO(),created_by:'sistem',type:'e-pošta',subject:fillT(tpl?.subject||'Opomnik: članarina {{leto}}',ctx),body:fillT(tpl?.body||'',ctx),date:td,status:'osnutek',recipients:`${labelOf('members',m)} <${m.email}>`,to_n:1,template:'Opomnik za članarino',auto:1,related:JSON.stringify({c:'fees',ids:[f.id]})});f.last_reminder=td;d++});
const et=live('email_templates').find(x=>x.key==='event_remind');
live('events').filter(e=>e.date>=td&&daysTo(e.date)<=R.events&&!['odpovedan','izveden'].includes(e.status)&&e.reminded!==e.date).forEach(e=>{const rs=segRecipients('event',e.id);if(!rs.length)return;const ctx={drustvo:S.st.org.name,ime:'udeleženec',priimek:'',dogodek:e.title,datum:fmtD(e.date)+(e.time?' ob '+e.time:''),lokacija:e.location||''};S.db.communications.push({id:uid(),created_at:nowISO(),created_by:'sistem',type:'e-pošta',subject:fillT(et?.subject||'Opomnik: {{dogodek}}',ctx),body:fillT(et?.body||'',ctx),date:td,status:'osnutek',recipients:rs.map(r=>`${r.name} <${r.email}>`).join('\n'),to_n:rs.length,template:'Opomnik dogodka',auto:1,related:JSON.stringify({c:'events',ids:[e.id]})});e.reminded=e.date;Store.mark('events');d++});
if(d)Store.mark('communications');S.st.auto.lastRun=td;Store.mark('settings');S.rev++;audit('avtomatizacija','admin',{id:'auto',name:'dnevna preverjanja'},null,{fees:a,invoices:b,osnutki:d},'settings');
if(manual)toast(`Zapadlo: ${a} članarin, ${b} računov. Pripravljenih osnutkov sporočil: ${d}.`,'ok',6000)}
